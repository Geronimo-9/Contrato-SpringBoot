<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container text-center" style="max-width: 400px;">
    <h2 class="mb-4">Ingreso al Sistema</h2>
    <div class="card shadow-sm p-4 text-start">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label>Cédula (ID)</label>
                <input type="text" name="id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
        </form>
    </div>
</div>
</body>
</html>
