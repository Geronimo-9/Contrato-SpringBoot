<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Nuevo Usuario</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/usuarios}" th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label class="form-label">Cédula (ID)</label>
                    <input type="text" class="form-control" th:field="*{id}" required maxlength="10" placeholder="Máximo 10 dígitos">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" th:field="*{contrasena}" required>
                </div>

                <!-- Selector de Enum Dinámico -->
                <div class="mb-4">
                    <label class="form-label">Rol de Usuario</label>
                    <select class="form-select" th:field="*{rol}" required>
                        <option th:each="r : ${T(org.contrato.model.domain.valueobject.usuario.RolUsuario).values()}"
                                th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Registrar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
