<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Modificar Usuario</h2>


<form th:action="@{/usuarios/modificar/{id}(id=${usuario.id})}" th:object="${usuario}" method="post">


    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Cédula (ID):</label>
        <input type="text" class="form-control" th:value="*{id}" disabled />
    </div>

    <div class="mb-3">
        <label class="form-label">Nombre:</label>
        <input type="text" th:field="*{nombre}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Contraseña:</label>
        <input type="text" th:field="*{contrasena}" class="form-control" required />
    </div>

    <div class="mb-4">
        <label class="form-label">Rol de Usuario</label>
        <select class="form-select" th:field="*{rol}" required>
            <option th:each="r : ${T(org.contrato.model.domain.valueobject.usuario.RolUsuario).values()}"
                    th:value="${r}" th:text="${r}"></option>
        </select>
    </div>

    <button type="submit" class="btn btn-warning">Actualizar Usuario</button>
    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
</form>
</body>
</html>
