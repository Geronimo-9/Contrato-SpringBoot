<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Usuarios</h2>
        <div>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Agregar Nuevo Usuario</a>
            <a th:href="@{/index}" class="btn btn-secondary">Volver al Menú</a>
        </div>
    </div>


    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/usuarios}" method="get" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label>Filtrar por Cédula (ID):</label>
                    <input type="text" name="paramId" class="form-control" placeholder="Ej: 1047... ">
                </div>
                <div class="col-md-5">
                    <label>Filtrar por Nombre:</label>
                    <input type="text" name="paramNombre" class="form-control" placeholder="Buscar por nombre...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>


    <table class="table table-striped table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Cédula (ID)</th>
            <th>Nombre Completo</th>
            <th>Rol</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre}"></td>
            <td><span class="badge bg-secondary" th:text="${u.rol}"></span></td>
            <td class="text-center">
                <a th:href="@{/usuarios/modificar/{id}(id=${u.id})}" class="btn btn-warning btn-sm me-2">Modificar</a>
                <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás 100% seguro de eliminar este usuario y todos sus contratos?');">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="4" class="text-center text-muted">No hay usuarios que coincidan con la búsqueda.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
