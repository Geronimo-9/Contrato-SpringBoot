<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="#">Panel Principal</a>
        <a th:href="@{/logout}" class="btn btn-danger btn-sm">Cerrar Sesión</a>
    </div>
</nav>
<div class="container text-center">
    <h1 class="mb-4">Bienvenido, <span th:text="${session.usuarioLogueado.nombre}">Usuario</span></h1>
    <div class="row justify-content-center gap-4">
        <div class="col-md-5 card shadow-sm p-4">
            <h4>Mis Contratos</h4>
            <p>Accede a tus contratos sin romper el dominio del sistema.</p>
            <a th:href="@{/contratos}" class="btn btn-success">Gestionar Mis Contratos</a>
        </div>
        <div class="col-md-5 card shadow-sm p-4">
            <h4>Gestión de Usuarios</h4>
            <p>CRUD de todos los usuarios registrados.</p>
            <a th:href="@{/usuarios}" class="btn btn-primary">Gestionar Usuarios</a>
        </div>
    </div>
</div>
</body>
</html>
