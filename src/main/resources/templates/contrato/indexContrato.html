<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Contratos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Mis Contratos</h2>
        <div>
            <a th:href="@{/contratos/nuevo}" class="btn btn-primary">Agregar Nuevo Contrato</a>
            <a th:href="@{/index}" class="btn btn-secondary">Volver al Menú</a>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Buscar mis contratos</h5>
            <form th:action="@{/contratos}" method="get" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Empresa</label>
                    <input type="text" name="empresa" class="form-control"
                           placeholder="Nombre de empresa..." th:value="${paramEmpresa}">
                </div>

                <div class="col-md-5">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="" th:selected="${paramEstado == null or paramEstado == ''}">
                            Todos
                        </option>
                        <option th:each="e : ${T(org.contrato.model.domain.valueobject.contrato.Estado).values()}"
                                th:value="${e}"
                                th:text="${e}"
                                th:selected="${paramEstado == e.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Empresa</th>
                <th>Empleado</th>
                <th>Funciones</th>
                <th>Monto</th>
                <th>Frecuencia de Pago</th>
                <th>Fecha Firma</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${contratos}">
                <td th:text="${c.empresa}"></td>
                <td th:text="${c.empleado}"></td>
                <td th:text="${c.funciones}"></td>
                <td th:text="${c.monto}"></td>
                <td th:text="${c.frecuenciaPago}"></td>
                <td th:text="${c.fechaFirma}"></td>
                <td th:text="${c.fechaInicio}"></td>
                <td th:text="${c.fechaFin}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${c.estado}"></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/contratos/modificar/{id}(id=${c.id})}"
                       class="btn btn-warning btn-sm">
                        Modificar
                    </a>

                    <form th:action="@{/contratos/eliminar/{id}(id=${c.id})}"
                          method="post"
                          class="d-inline">
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Estás seguro de eliminar este contrato?');">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(contratos)}">
                <td colspan="10" class="text-center text-muted">
                    No tienes contratos registrados.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
