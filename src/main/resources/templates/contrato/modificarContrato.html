<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Contrato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h3 class="mb-0">Modificar Contrato</h3>
        </div>

        <div class="card-body">
            <form th:action="@{/contratos/modificar/{id}(id=${contrato.id})}"
                  th:object="${contrato}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Empresa</label>
                    <input type="text" th:field="*{empresa}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Empleado</label>
                    <input type="text" th:field="*{empleado}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Funciones</label>
                    <textarea th:field="*{funciones}" class="form-control" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Monto</label>
                    <input type="number" step="0.01" th:field="*{monto}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Frecuencia de Pago</label>
                    <select th:field="*{frecuenciaPago}" class="form-select" required>
                        <option th:each="f : ${T(org.contrato.model.domain.valueobject.contrato.FrecuenciaPago).values()}"
                                th:value="${f}"
                                th:text="${f}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Firma</label>
                    <input type="date" th:field="*{fechaFirma}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Inicio</label>
                    <input type="date" th:field="*{fechaInicio}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Fin</label>
                    <input type="date" th:field="*{fechaFin}" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Estado</label>
                    <select th:field="*{estado}" class="form-select" required>
                        <option th:each="e : ${T(org.contrato.model.domain.valueobject.contrato.Estado).values()}"
                                th:value="${e}"
                                th:text="${e}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-warning">Actualizar Contrato</button>
                <a th:href="@{/contratos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
